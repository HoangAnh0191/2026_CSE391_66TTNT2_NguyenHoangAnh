<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 2.2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="formBox">
      <h2>Đặt hàng trực tuyến</h2>

      <label>Tên sản phẩm</label>
      <select id="product">
        <option value="">-- Chọn sản phẩm --</option>
        <option value="Áo">Áo – 150.000₫</option>
        <option value="Quần">Quần – 200.000₫</option>
        <option value="Giày">Giày – 350.000₫</option>
        <option value="Mũ">Mũ – 80.000₫</option>
      </select>
      <span class="error" id="err-product"></span>

      <label>Số lượng</label>
      <input
        type="number"
        id="quantity"
        min="1"
        max="99"
        placeholder="1 – 99"
      />
      <span class="error" id="err-quantity"></span>

      <label>Tổng tiền</label>
      <div id="totalDisplay">—</div>

      <label>Ngày giao hàng</label>
      <input type="date" id="delivery" />
      <span class="error" id="err-delivery"></span>

      <label>Địa chỉ giao</label>
      <input type="text" id="address" placeholder="Tối thiểu 10 ký tự" />
      <span class="error" id="err-address"></span>

      <label>Ghi chú <small>(không bắt buộc)</small></label>
      <textarea id="note" rows="3" placeholder="Tối đa 200 ký tự"></textarea>
      <span id="charCount">0/200</span>
      <span class="error" id="err-note"></span>

      <label>Phương thức thanh toán</label>
      <div id="paymentGroup">
        <label><input type="radio" name="payment" value="COD" /> COD</label>
        <label
          ><input type="radio" name="payment" value="Chuyển khoản" /> Chuyển
          khoản</label
        >
        <label
          ><input type="radio" name="payment" value="Ví điện tử" /> Ví điện
          tử</label
        >
      </div>
      <span class="error" id="err-payment"></span>

      <button onclick="handleOrder()">Đặt hàng</button>
    </div>

    <div id="confirmBox">
      <h3>Xác nhận đơn hàng</h3>
      <div id="confirmInfo"></div>
      <button onclick="handleConfirm()">Xác nhận</button>
      <button onclick="handleCancel()">Hủy</button>
    </div>

    <div id="successBox">
      <p>Đặt hàng thành công!</p>
      <p>Cảm ơn bạn đã đặt hàng.</p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
