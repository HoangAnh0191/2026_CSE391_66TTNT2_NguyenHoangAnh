<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 1.1</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="box">
      <div>
        <h2>BẢNG ĐIỂM SINH VIÊN</h2>
      </div>
      <div>
        <label>Họ và tên:</label>
        <input type="text" id="name" placeholder="Nhập họ và tên" />
      </div>

      <div>
        <label>Điểm:</label>
        <input type="number" id="grade" placeholder="Nhập điểm (0-10)" />
      </div>

      <button id="button">Thêm</button>

      <div class="table">
        <table border="1">
          <thead>
            <tr>
              <th>STT</th>
              <th>Họ tên</th>
              <th>Điểm</th>
              <th>Xếp loại</th>
              <th>Thao tác</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="summary"></div>
      <div id="average"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
