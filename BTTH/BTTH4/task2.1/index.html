<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 2.1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-box" id="formBox">
      <h2>Đăng ký tài khoản</h2>

      <div class="field">
        <label for="fullname">Họ và tên</label>
        <input type="text" id="fullname" placeholder="Nguyễn Văn A" />
        <span class="error" id="err-fullname"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@gmail.com" />
        <span class="error" id="err-email"></span>
      </div>

      <div class="field">
        <label for="phone">Số điện thoại</label>
        <input type="tel" id="phone" maxlength="10" />
        <span class="error" id="err-phone"></span>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Tối thiểu 8 ký tự" />
        <span class="error" id="err-password"></span>
      </div>

      <div class="field">
        <label for="confirm">Xác nhận mật khẩu</label>
        <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" />
        <span class="error" id="err-confirm"></span>
      </div>

      <div class="field">
        <label>Giới tính</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male" /> Nam</label>
          <label><input type="radio" name="gender" value="female" /> Nữ</label>
          <label><input type="radio" name="gender" value="other" /> Khác</label>
        </div>
        <span class="error" id="err-gender"></span>
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="terms" />
          Tôi đồng ý với điều khoản dịch vụ
        </label>
        <span class="error" id="err-terms"></span>
      </div>

      <button id="btnSubmit" type="button">Đăng ký</button>
    </div>

    <div class="success-box" id="successBox">
      <p>Đăng ký thành công!</p>
      <p>Chào mừng, <strong id="successName"></strong>!</p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
